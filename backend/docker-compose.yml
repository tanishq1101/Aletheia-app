services:
  # The API owns ingestion and every local ML model. Keeping them in one image
  # eliminates the old backend/DL-service split and its network boundary.
  api:
    build:
      context: .
    container_name: aletheia-api
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://research:research@db:5432/research_intelligence
      CORS_ORIGINS: http://localhost:3000
      # These three are container-network/filesystem facts, not deployment
      # config, so they always override whatever host-oriented value .env
      # carries: chroma is reached over the compose network at its internal
      # port (8001 in .env is only the host-mapped port), and the storage /
      # research-model paths must stay the absolute in-image paths baked into
      # the Dockerfile, not the host-relative paths .env uses for bare-metal dev.
      CHROMA_HOST: chroma
      CHROMA_PORT: "8000"
      REDIS_URL: redis://redis:6379/0
      LOCAL_STORAGE_DIR: /data/storage
      RESEARCH_MODELS_DIR: /app/models/research
    ports:
      - "8000:8000"
    volumes:
      - source_data:/data/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    # pg17 matches the Postgres major version on the Supabase account, so the
    # eventual migration does not cross a major version boundary.
    image: pgvector/pgvector:pg17
    container_name: research-intelligence-db
    environment:
      POSTGRES_USER: research
      POSTGRES_PASSWORD: research
      POSTGRES_DB: research_intelligence
    ports:
      # 5433 on the host to avoid colliding with an existing local Postgres.
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U research -d research_intelligence"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Vector store. Chroma is the primary index for chunk embeddings; the same
  # vectors are mirrored into Neon's pgvector column so retrieval degrades to
  # SQL instead of failing when this container is down.
  chroma:
    image: chromadb/chroma:1.5.9
    container_name: research-intelligence-chroma
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
    ports:
      # 8001 on the host: 8000 is the FastAPI port.
      - "8001:8000"
    volumes:
      - chroma_data:/data
    healthcheck:
      test: ["CMD", "/bin/bash", "-c", "cat < /dev/null > /dev/tcp/localhost/8000"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Shared rate-limit counters. The API treats this as a limiter, not a
  # dependency: if it is down, request budgets fall back to a per-process
  # window and the service keeps answering. Nothing here needs to survive a
  # restart — a lost window costs one caller one extra minute of allowance —
  # so there is no volume and no persistence configured.
  redis:
    image: redis:8.2-alpine
    container_name: research-intelligence-redis
    command: >-
      redis-server
      --save ""
      --appendonly no
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
    ports:
      # 6380 on the host to avoid colliding with an existing local Redis.
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  db_data:
  chroma_data:
  source_data:
