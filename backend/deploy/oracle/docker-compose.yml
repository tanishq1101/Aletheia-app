# The Aletheia API on an Oracle Cloud always-free A1 (Ampere, aarch64) instance.
#
# Two containers. `api` is the same image the Dockerfile builds for every other
# host -- no arm64 variant, because every native wheel it needs (onnxruntime,
# pymupdf, numpy, psycopg, cryptography, tokenizers) publishes an aarch64 build
# and was verified to import there. `caddy` terminates TLS and is the only
# process with a published port, so there is no plaintext route to FastAPI from
# the internet at all.
#
# Three things are deliberately absent:
#
#   * **Redis.** With `REDIS_URL` empty the rate limiter keeps its windows in
#     process, and with exactly one API container those windows are the real,
#     complete, cluster-wide counters -- not an approximation. A Redis here
#     would buy nothing and add a second thing that can fail. It becomes
#     necessary the moment there are two API instances, which needs the
#     stranded-job constraint below solved first.
#
#   * **Postgres.** The database is Neon: it already holds the rows and the
#     pgvector index, and it is backed up by someone else.
#
#   * **Chroma.** Retrieval reads Chroma and falls back to pgvector, and that
#     fallback returns the same chunk ids in the same order with the same
#     scores to four decimal places. Running it would mean a second service
#     holding a copy of vectors Neon already stores.

name: aletheia

services:
  api:
    build:
      # backend/, two levels up -- where the Dockerfile and .dockerignore live.
      context: ../..
      dockerfile: Dockerfile
    image: aletheia-api:local
    restart: unless-stopped
    deploy:
      # ONE instance. This is a correctness constraint, not a capacity choice:
      # recover_stranded_jobs() in main.py fails every job still marked
      # 'running' at startup, on the assumption that the process holding it
      # died. A second container booting would fail the first one's in-flight
      # ingestion and mark a paper broken while it was being read.
      replicas: 1
    env_file:
      # `required: false` so `docker compose config` works on a laptop, where
      # there is deliberately no .env -- deploy.sh validates the file before
      # shipping, and checks for the instance's own .env explicitly with a
      # message that says what to do. Compose's own error for a missing env_file
      # would otherwise fire first, on the wrong machine, for the wrong reason.
      - path: .env
        required: false
    environment:
      # Container-filesystem facts rather than deployment config, so they
      # override whatever .env carries: these are the absolute in-image paths
      # the Dockerfile bakes, not the host-relative ones bare-metal dev uses.
      LOCAL_STORAGE_DIR: /data/storage
      RESEARCH_MODELS_DIR: /app/models/research
      PORT: "8000"
    volumes:
      # Uploaded PDFs and extracted figures. A *named volume*, not a bind mount
      # into the source tree: `docker compose down -v` is the only thing that
      # can remove it, and a redeploy that replaces the source directory cannot
      # take the library with it.
      - papers:/data/storage
    # No `ports:`. Caddy reaches this over the compose network; nothing
    # publishes 8000 on the host, so TLS is not something a client can skip.
    expose:
      - "8000"
    # The A1 shape has 24 GB. Measured peak for one 75-page paper on aarch64 is
    # 2.28 GB (415 MB idle with both ONNX models loaded), so this is roughly
    # 2.5x headroom for a much larger document. The point of a limit here is not
    # to save memory -- it is that a runaway container hits a predictable OOM
    # instead of letting the kernel pick a victim, and the victim it picks on a
    # single-purpose box is often sshd. Do not raise this above ~20 GB.
    mem_limit: 6g
    healthcheck:
      # Healthy means "the process is serving", which is deliberately weaker
      # than what /health reports. /health returns 503 when a dependency is
      # degraded, and a degraded API is exactly when you most need Caddy to
      # keep routing so you can read the body and find out why. So an HTTP
      # error status counts as healthy here; only a connection failure does not.
      test:
        - CMD
        - python
        - -c
        - |
          import sys, urllib.error, urllib.request
          try:
              urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=5)
          except urllib.error.HTTPError:
              pass
          except Exception:
              sys.exit(1)
      interval: 30s
      timeout: 10s
      retries: 3
      # Migrations run on boot before uvicorn binds (see the Dockerfile CMD), so
      # first start is slower than a restart. Generous, because a container
      # marked unhealthy during a legitimate migration would be restarted
      # mid-migration.
      start_period: 120s
    logging:
      # Without a cap, container logs are the thing that fills a boot volume on
      # a long-running instance, and the symptom is unrelated write failures.
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      # HTTP/3. Harmless if the VCN security list does not allow UDP; clients
      # simply stay on TCP.
      - "443:443/udp"
    environment:
      # Fails the `up` with a readable message rather than starting a Caddy that
      # serves nothing, which is what an empty site address does.
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN in deploy/oracle/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and the ACME account key. This volume MUST persist: Let's
      # Encrypt allows 5 duplicate certificates per week, so a Caddy that loses
      # /data re-issues on every restart and locks you out of your own domain
      # for days.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        # Nothing is exposed to the internet until the API answers, so the
        # first request after a deploy cannot arrive at a 502.
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  papers:
  caddy_data:
  caddy_config:
